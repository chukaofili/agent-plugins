name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Structure, frontmatter, skill references and versions
        run: |
          pip install pyyaml
          python3 scripts/validate.py

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Claude Code manifests
        run: |
          npx -y @anthropic-ai/claude-code@2.1.303 plugin validate .
          for dir in plugins/*/; do
            npx -y @anthropic-ai/claude-code@2.1.303 plugin validate "$dir"
          done

      - name: Skills CLI discovers every skill
        run: |
          expected=$(find plugins -name SKILL.md | wc -l | tr -d ' ')
          # The CLI colours its output under CI=true, so strip ANSI codes before matching.
          output=$(npx -y skills@1.7.2 add . --list </dev/null 2>&1 | sed 's/\x1b\[[0-9;?]*[a-zA-Z]//g')
          found=$(echo "$output" | sed -nE 's/.*Found ([0-9]+) skills.*/\1/p' | head -1)
          echo "expected=$expected found=${found:-none}"
          test "$expected" = "$found"

      - name: Links in markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
