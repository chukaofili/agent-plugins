name: coding-protocol-image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: echo "version=$(jq -r .version plugins/coding-protocol/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: plugins/coding-protocol
          file: .github/docker/plugin.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/coding-protocol:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/coding-protocol:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=coding-protocol Claude plugin as an OCI image for kagent

      - run: echo "ghcr.io/${{ github.repository_owner }}/coding-protocol@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
