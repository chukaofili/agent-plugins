# Installed by the coding-protocol `setup` skill, with merge-gate-rerun.yml.
# A review event runs the pull request's own copy of a workflow, so this one
# does nothing and holds no permissions. Its only job is to finish, which
# starts merge-gate-rerun.yml from the default branch.
name: merge-gate-review

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: "true"
